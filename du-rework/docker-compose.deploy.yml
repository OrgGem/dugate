# Deployment-oriented aggregate. PostgreSQL and Redis/Valkey are external and
# are never created or reconfigured by this aggregate. Application images
# migrate their configured application databases unless DU_MIGRATION_ENABLED=false.
name: du-rework-deploy
include:
  - compose/deploy-infra.yml
  - compose/orchestrator.yml
  - compose/connector.yml
  - compose/document-core.yml
  - compose/lc-checker.yml
  - compose/example-review.yml
