# Candidate-run overlay for live-gates EXECUTION (Packet 7, reviewer §12.3/§12.6).
# Publishes the isolated candidate project's PostgreSQL to host loopback so the
# harness can run direct SQL checks (0035/0036 applied-state, plaintext scan)
