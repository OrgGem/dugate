worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Keep the proxy ceiling compatible with the legacy 64 MiB multipart limit;
  # individual API and Admin handlers still enforce their narrower limits.
  client_max_body_size 64m;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65s;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  include /etc/du/availability/ingress/selected-upstream.conf;

  map $http_upgrade $du_connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/internal/ { return 404; }
    location ^~ /api/runtime/v1/ { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /connector/internal/ { return 404; }

    location = /admin { return 308 /admin/; }
    location ^~ /admin/api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://$du_orchestrator_admin_upstream;
    }
    location ^~ /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://$du_orchestrator_admin_upstream;
    }
    location ^~ /connector/ {
      rewrite ^/connector/(.*)$ /$1 break;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://$du_connector_upstream;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://$du_orchestrator_api_upstream;
    }
  }

  # Private worker-to-runtime path. This listener is not published to the host.
  server {
    listen 8080;
    server_name _;
    allow 172.31.0.0/24;
    deny all;
    location ^~ /api/runtime/v1/ {
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$du_orchestrator_api_upstream;
    }
    location ^~ /connector/ {
      rewrite ^/connector/(.*)$ /$1 break;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://$du_connector_upstream;
    }
    location / { return 404; }
  }

  # Private, authenticated identity and internal-control paths. Docker's
  # loopback-published host probe can be DNATed to the ingress bridge gateway
  # rather than arriving from 127.0.0.1, so the dedicated control subnet is
  # allowed as well. Upstream services still validate bearer tokens and return
  # the actual process identity/build tuple; native deployments must verify the
  # observed DNAT source before treating the host probe as reachable.
  server {
    listen 8081;
    server_name _;
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;
    location = /orchestrator/identity {
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Length '';
      proxy_pass http://$du_orchestrator_control_upstream/api/internal/service-runtime/identity;
    }
    location = /connector/identity {
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type application/json;
      proxy_pass http://$du_connector_control_upstream/internal/admin/runtime-control/observe;
    }
    location ^~ /api/internal/ {
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_pass http://$du_orchestrator_control_upstream;
    }
    location ^~ /connector/ {
      rewrite ^/connector/(.*)$ /$1 break;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_pass http://$du_connector_control_upstream;
    }
    location / { return 404; }
  }
}
