# Initial blue target. The root-owned reload-selector atomically regenerates
# this complete include from the two validated selector files.
map $host $du_orchestrator_api_upstream { default orchestrator-blue-http:3000; }
map $host $du_orchestrator_admin_upstream { default orchestrator-blue-http:3001; }
map $host $du_orchestrator_control_upstream { default orchestrator-blue-control:3002; }
map $host $du_connector_upstream { default connector-blue-http:8080; }
map $host $du_connector_control_upstream { default connector-blue-control:8080; }
