services:
  orchestrator-migrate:
    image: ${DU_ORCHESTRATOR_RUNTIME_IMAGE_DIGEST:-${DU_IMAGE_PREFIX:-du}-orchestrator:${DU_IMAGE_TAG:-local}}
    build:
      context: ../orchestrator
      dockerfile: services/orchestrator/Dockerfile
    entrypoint: [node, /app/dist/migrate-cli.js]
    command: [migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the provisioned Orchestrator PostgreSQL database}
    networks: [du-platform-net]
    profiles: [migration]
    init: true
    restart: 'no'
  orchestrator:
    image: ${DU_ORCHESTRATOR_RUNTIME_IMAGE_DIGEST:-${DU_IMAGE_PREFIX:-du}-orchestrator:${DU_IMAGE_TAG:-local}}
    build:
      context: ../orchestrator
      dockerfile: services/orchestrator/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: '3000'
      ORCHESTRATOR_INTERNAL_HOST: 0.0.0.0
      ORCHESTRATOR_INTERNAL_PORT: '3002'
      ORCHESTRATOR_INTERNAL_BASE_URL: ${ORCHESTRATOR_INTERNAL_BASE_URL:-http://orchestrator:3002}
      DU_S3_SOURCE_RULES: ${DU_S3_SOURCE_RULES:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the provisioned Orchestrator PostgreSQL database}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the existing Redis or Valkey service}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?Set RUNTIME_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a distinct ADMIN_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set the retained ENCRYPTION_KEY (at least 32 UTF-8 bytes)}
      INVOCATION_GRANT_SECRET: ${INVOCATION_GRANT_SECRET:?Set the raw printable ASCII 32-byte invocation grant secret}
      DU_CONNECTOR_BASE_URLS: ${DU_CONNECTOR_BASE_URLS:?Set the JSON connector ID-to-base-URL map}
      SERVICE_IDENTITY_SECRET: ${SERVICE_IDENTITY_SECRET:?Set the shared Base64-encoded 32-byte service identity key}
      COST_CONTROL_CONNECTOR_TOKEN: ${COST_CONTROL_CONNECTOR_TOKEN:?Set the dedicated cost-control service token}
      DU_ORCHESTRATOR_RUNTIME_IDENTITY: ${DU_ORCHESTRATOR_RUNTIME_IDENTITY:-}
      DU_ORCHESTRATOR_RUNTIME_SLOT: ${DU_ORCHESTRATOR_RUNTIME_SLOT:-}
      DU_ORCHESTRATOR_RUNTIME_REVISION: ${DU_ORCHESTRATOR_RUNTIME_REVISION:-}
      DU_ORCHESTRATOR_RUNTIME_IMAGE_DIGEST: ${DU_ORCHESTRATOR_RUNTIME_IMAGE_DIGEST:-}
      DU_ORCHESTRATOR_SERVICE_RUNTIME_CONTROL_TOKEN: ${DU_ORCHESTRATOR_SERVICE_RUNTIME_CONTROL_TOKEN:-}
      DU_MAINTENANCE_EXECUTION_ROLE: web
      WORKER_IDENTITY_TOKENS_BY_BUSINESS: ${WORKER_IDENTITY_TOKENS_BY_BUSINESS:?Set the business-to-worker identity token map}
      TENANT_ADMIN_TOKENS_BY_TENANT: ${TENANT_ADMIN_TOKENS_BY_TENANT:-}
      AUTO_MIGRATE: 'false'
      ADMIN_SHELL_HOST: 0.0.0.0
      ADMIN_SHELL_PORT: '3001'
      ADMIN_SHELL_COOKIE_SECRET: ${ADMIN_SHELL_COOKIE_SECRET:?Set ADMIN_SHELL_COOKIE_SECRET}
      DU_ADMIN_WEB: '1'
      DU_ADMIN_WEB_DIST: /app/admin-web
      DU_ADMIN_AUTH_MODE: ${DU_ADMIN_AUTH_MODE:-}
      DU_ADMIN_TRUST_PROXY_PROTOCOL: ${DU_ADMIN_TRUST_PROXY_PROTOCOL:-false}
      SHUTDOWN_BUDGET_MS: ${SHUTDOWN_BUDGET_MS:-30000}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-postgres}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-}
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-}
      ARTIFACT_S3_FORCE_PATH_STYLE: ${ARTIFACT_S3_FORCE_PATH_STYLE:-false}
      ARTIFACT_STORAGE_MIGRATION_WINDOW: ${ARTIFACT_STORAGE_MIGRATION_WINDOW:-false}
      DU_STORAGE_CREDENTIAL_VERSION_REF: ${DU_STORAGE_CREDENTIAL_VERSION_REF:-}
      DU_STORAGE_CREDENTIAL_OWNER_TENANT_ID: ${DU_STORAGE_CREDENTIAL_OWNER_TENANT_ID:-}
      DU_STORAGE_ENDPOINT_ALLOWLIST: ${DU_STORAGE_ENDPOINT_ALLOWLIST:-}
      DU_SECRET_CATALOG_ACTIVE_KEY_VERSION: ${DU_SECRET_CATALOG_ACTIVE_KEY_VERSION:-}
      DU_SECRET_CATALOG_KEYRING_JSON: ${DU_SECRET_CATALOG_KEYRING_JSON:-}
      DU_LOCAL_ENCRYPTION_ACTIVE_KEY_VERSION: ${DU_LOCAL_ENCRYPTION_ACTIVE_KEY_VERSION:-}
      DU_LOCAL_ENCRYPTION_KEYRING_JSON: ${DU_LOCAL_ENCRYPTION_KEYRING_JSON:-}
      DU_ADMIN_LOCAL_SERVICE_SECRET: ${DU_ADMIN_LOCAL_SERVICE_SECRET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DU_ENCRYPTION_METADATA_ENABLED: ${DU_ENCRYPTION_METADATA_ENABLED:-true}
      DU_ENCRYPTION_PUBLIC_UPLOAD_ENABLED: ${DU_ENCRYPTION_PUBLIC_UPLOAD_ENABLED:-true}
      DU_DATA_MODE: ${DU_DATA_MODE:-real}
      DU_SYNTHETIC_DATA_ACK: ${DU_SYNTHETIC_DATA_ACK:-}
      DU_METADATA_PLAINTEXT_READ_MODE: ${DU_METADATA_PLAINTEXT_READ_MODE:-forbid}
      DU_SOURCE_CREDENTIAL_ORIGIN_MODE: ${DU_SOURCE_CREDENTIAL_ORIGIN_MODE:-warn}
      DU_METADATA_PLAINTEXT_WINDOW_START: ${DU_METADATA_PLAINTEXT_WINDOW_START:-}
      DU_METADATA_PLAINTEXT_WINDOW_END: ${DU_METADATA_PLAINTEXT_WINDOW_END:-}
      DU_VAULT_TRANSIT_OPTIONS: ${DU_VAULT_TRANSIT_OPTIONS:-}
      DU_VAULT_TRANSIT_ENC_TOKEN: ${DU_VAULT_TRANSIT_ENC_TOKEN:-}
      DU_VAULT_TRANSIT_DEC_TOKEN: ${DU_VAULT_TRANSIT_DEC_TOKEN:-}
      USAGE_TOKEN: ${USAGE_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      DU_ADMIN_WEB_ROUTES: ${DU_ADMIN_WEB_ROUTES:-}
      DU_VAULT_KV_OPTIONS: ${DU_VAULT_KV_OPTIONS:-}
      DU_VAULT_KV_TOKEN: ${DU_VAULT_KV_TOKEN:-}
      DU_CONNECTOR_INITIAL_BINDINGS: ${DU_CONNECTOR_INITIAL_BINDINGS:-}
      DU_ADMIN_OIDC_ISSUER: ${DU_ADMIN_OIDC_ISSUER:-}
      DU_ADMIN_OIDC_CLIENT_ID: ${DU_ADMIN_OIDC_CLIENT_ID:-}
      DU_ADMIN_OIDC_CLIENT_SECRET: ${DU_ADMIN_OIDC_CLIENT_SECRET:-}
      DU_ADMIN_OIDC_REDIRECT_URI: ${DU_ADMIN_OIDC_REDIRECT_URI:-}
      DU_ADMIN_OIDC_ALLOWED_ISSUERS: ${DU_ADMIN_OIDC_ALLOWED_ISSUERS:-}
      DU_ADMIN_OIDC_PUBLIC_ORIGIN: ${DU_ADMIN_OIDC_PUBLIC_ORIGIN:-}
      DU_ADMIN_OIDC_SESSION_BACKEND: ${DU_ADMIN_OIDC_SESSION_BACKEND:-}
      DU_ADMIN_OIDC_PKCE_METHOD: ${DU_ADMIN_OIDC_PKCE_METHOD:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${ORCHESTRATOR_PORT:-3000}:3000'
      - '${BIND_ADDRESS:-127.0.0.1}:${ADMIN_SHELL_PORT:-3001}:3001'
    networks: [du-platform-net, du-worker-net]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
