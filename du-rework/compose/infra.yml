services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-du}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-du_orchestrator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [du-platform-net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    command: [valkey-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - valkeydata:/data
    networks: [du-platform-net, du-worker-net]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
  connector-db-init:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if psql --no-psqlrc --tuples-only --no-align --host=postgres --username="$$POSTGRES_USER" --dbname=postgres --command "SELECT 1 FROM pg_database WHERE datname='du_connector'" | grep -q '^1$'; then
          exit 0
        fi
        createdb --host=postgres --username="$$POSTGRES_USER" --maintenance-db=postgres du_connector
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-du}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [du-platform-net]
    profiles: [local-bootstrap]
    init: true
    restart: 'no'
networks:
  du-platform-net: {}
  du-worker-net: {}
volumes:
  pgdata: {}
  valkeydata: {}
