services:
  lc-checker:
    image: ${LC_IMAGE_DIGEST:-${DU_IMAGE_PREFIX:-du}-lc-checker:${DU_IMAGE_TAG:-local}}
    build:
      context: ../businesses/lc-checker
      dockerfile: Dockerfile
    environment:
      RUNTIME_URL: ${RUNTIME_URL:-http://orchestrator:3002/api/runtime/v1}
      RUNTIME_TOKEN: ${LC_RUNTIME_TOKEN:?Set the lc-checker business identity token}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      CONCURRENCY: ${LC_CONCURRENCY:-4}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
      IMAGE_DIGEST: ${LC_IMAGE_DIGEST:-}
      CONNECTOR_URL: ${CONNECTOR_URL:-http://connector:8080}
      CONNECTOR_SERVICE_TOKEN: ${CONNECTOR_SERVICE_TOKEN:?Set a signed connector:invoke service identity token}
      MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-67108864}
    networks: [du-worker-net]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
