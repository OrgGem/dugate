name: du-orchestrator-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: du
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run node scripts/init-orchestrator-local.cjs first}
      POSTGRES_DB: du_orchestrator_dev
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U du -d du_orchestrator_dev']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:16380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
