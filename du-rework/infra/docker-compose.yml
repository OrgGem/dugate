# Isolated du-rework test infra — does NOT touch existing dev containers.
# Host ports chosen to avoid collisions (verified 2026-09-20: 5433/6380 free).
#
# Usage:  docker compose -f infra/docker-compose.yml up -d
#         docker compose -f infra/docker-compose.yml down -v   (teardown)
name: du-rework-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: du-rework-postgres
    environment:
      POSTGRES_USER: du
      POSTGRES_PASSWORD: du-test-only
      POSTGRES_DB: du_orchestrator_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U du -d du_orchestrator_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: du-rework-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
