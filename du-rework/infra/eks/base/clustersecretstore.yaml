# External Secrets provider. Thay REGION thật. ClusterSecretStore dùng chung cho
# cả 3 ExternalSecret; IRSA role của external-secrets controller cần quyền
# secretsmanager:GetSecretValue trên 3 secret dưới (do deployment owner cấp).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: du-cluster-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
