# Secrets Manager entry `du/orchestrator` (JSON key-value) phải chứa đủ các property
# dưới đây. Không commit giá trị thật.
# Lưu ý: DU_CONNECTOR_MANAGEMENT_HEADERS đã OBSOLETE — main.ts từ chối boot nếu set.
#   Identity cho management surface được ký per-request từ SERVICE_IDENTITY_SECRET
#   (đã sync dưới đây), không qua header tĩnh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orchestrator
  namespace: du-platform
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: du-cluster-store
  target:
    name: orchestrator
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: du/orchestrator, property: DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: du/orchestrator, property: REDIS_URL }
    - secretKey: RUNTIME_TOKEN
      remoteRef: { key: du/orchestrator, property: RUNTIME_TOKEN }
    - secretKey: ADMIN_TOKEN
      remoteRef: { key: du/orchestrator, property: ADMIN_TOKEN }
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: du/orchestrator, property: ENCRYPTION_KEY }
    - secretKey: INVOCATION_GRANT_SECRET
      remoteRef: { key: du/orchestrator, property: INVOCATION_GRANT_SECRET }
    - secretKey: SERVICE_IDENTITY_SECRET
      remoteRef: { key: du/orchestrator, property: SERVICE_IDENTITY_SECRET }
    - secretKey: WORKER_IDENTITY_TOKENS_BY_BUSINESS
      remoteRef: { key: du/orchestrator, property: WORKER_IDENTITY_TOKENS_BY_BUSINESS }
    - secretKey: TENANT_ADMIN_TOKENS_BY_TENANT
      remoteRef: { key: du/orchestrator, property: TENANT_ADMIN_TOKENS_BY_TENANT }
    - secretKey: ADMIN_SHELL_COOKIE_SECRET
      remoteRef: { key: du/orchestrator, property: ADMIN_SHELL_COOKIE_SECRET }
    - secretKey: DU_VAULT_TRANSIT_ENC_TOKEN
      remoteRef: { key: du/orchestrator, property: DU_VAULT_TRANSIT_ENC_TOKEN }
    - secretKey: DU_VAULT_TRANSIT_DEC_TOKEN
      remoteRef: { key: du/orchestrator, property: DU_VAULT_TRANSIT_DEC_TOKEN }
    - secretKey: USAGE_TOKEN
      remoteRef: { key: du/orchestrator, property: USAGE_TOKEN }
    - secretKey: WEBHOOK_SECRET
      remoteRef: { key: du/orchestrator, property: WEBHOOK_SECRET }
    - secretKey: DU_VAULT_KV_TOKEN
      remoteRef: { key: du/orchestrator, property: DU_VAULT_KV_TOKEN }
    - secretKey: DU_ADMIN_OIDC_CLIENT_SECRET
      remoteRef: { key: du/orchestrator, property: DU_ADMIN_OIDC_CLIENT_SECRET }
