# HPA mẫu theo CPU/memory. KHÔNG scale chỉ theo RPS.
# Worker/autoscaling thật phải theo backlog-per-ready-instance + oldest runnable age
# và outbox age/in-flight qua KEDA/custom-metrics (xem 07-capacity) — deployment owner bổ sung.
# Connector KHÔNG có HPA ở đây vì replicas: 1 mặc định (migration chưa serialize);
# thêm HPA cho connector chỉ sau khi migration owner serialize xong.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator
  namespace: du-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
