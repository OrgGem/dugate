# Migration một lần, map từ service `migrate` trong compose/orchestrator.yml.
# Chạy TRƯỚC rollout, sau đó verify read-only rồi mới mở ingress (xem 12c §4).
# AUTO_MIGRATE=false trong Deployment — Job này là đường migration duy nhất.
apiVersion: batch/v1
kind: Job
metadata:
  name: orchestrator-migrate
  namespace: du-platform
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator-migrate
        app.kubernetes.io/part-of: du-rework
    spec:
      serviceAccountName: orchestrator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: du-orchestrator:local # pin digest trong kustomization.yaml
          imagePullPolicy: IfNotPresent
          command: [node, dist/migrate-cli.js, migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: orchestrator, key: DATABASE_URL }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
