# Secrets Manager entry `du/workers` (JSON key-value). Worker KHÔNG có DATABASE_URL.
# CONNECTOR_SERVICE_TOKEN là signed connector:invoke identity (xem 12b §2 về identity expiry).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workers
  namespace: du-platform
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: du-cluster-store
  target:
    name: workers
    creationPolicy: Owner
  data:
    - secretKey: RUNTIME_TOKEN
      remoteRef: { key: du/workers, property: RUNTIME_TOKEN }
    - secretKey: REDIS_URL
      remoteRef: { key: du/workers, property: REDIS_URL }
    - secretKey: CONNECTOR_SERVICE_TOKEN
      remoteRef: { key: du/workers, property: CONNECTOR_SERVICE_TOKEN }
