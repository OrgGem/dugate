# Mỗi Deployment một ServiceAccount riêng để gắn IRSA role khác nhau (least privilege).
# Thay role ARN thật của deployment owner trước khi apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: du-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/du-orchestrator-irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connector
  namespace: du-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/du-connector-irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-core
  namespace: du-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/du-worker-irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lc-checker
  namespace: du-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/du-worker-irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-review
  namespace: du-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/du-worker-irsa
