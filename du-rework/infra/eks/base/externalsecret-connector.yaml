# Secrets Manager entry `du/connector` (JSON key-value). Lưu ý INVOCATION_GRANT_SECRET
# ở đây là giá trị base64 của grant key (tương ứng CONNECTOR_INVOCATION_GRANT_SECRET
# trong compose/connector.yml), khác với INVOCATION_GRANT_SECRET raw 32-byte phía orchestrator.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: connector
  namespace: du-platform
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: du-cluster-store
  target:
    name: connector
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: du/connector, property: DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: du/connector, property: REDIS_URL }
    - secretKey: SERVICE_IDENTITY_SECRET
      remoteRef: { key: du/connector, property: SERVICE_IDENTITY_SECRET }
    - secretKey: INVOCATION_GRANT_SECRET
      remoteRef: { key: du/connector, property: INVOCATION_GRANT_SECRET }
    - secretKey: CONNECTOR_ENCRYPTION_KEY
      remoteRef: { key: du/connector, property: CONNECTOR_ENCRYPTION_KEY }
    - secretKey: USAGE_SINK_TOKEN
      remoteRef: { key: du/connector, property: USAGE_SINK_TOKEN }
