# Docker Compose Live Test Infra for du-rework
# Includes PostgreSQL, Redis, MinIO (S3 compatible), and HashiCorp Vault.
#
# Usage:
#   docker compose -f infra/docker-compose.live.yml up -d
#   powershell -ExecutionPolicy Bypass -File infra/scripts/init-live-infra.ps1
#   docker compose -f infra/docker-compose.live.yml down

name: du-rework-live

services:
  postgres:
    image: postgres:16-alpine
    container_name: du-live-postgres
    environment:
      POSTGRES_USER: du
      POSTGRES_PASSWORD: du-test-only
      POSTGRES_DB: du_orchestrator_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U du -d du_orchestrator_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: du-live-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: du-live-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    ports:
      - "127.0.0.1:9003:9000"
      # DEV NOTE: Host port 9014 used for MinIO console (9004 is occupied by onlyoffice-documentserver)
      - "127.0.0.1:9014:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:latest
    container_name: du-live-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-dev-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "vault status || exit 0"]
      interval: 3s
      timeout: 3s
      retries: 20
