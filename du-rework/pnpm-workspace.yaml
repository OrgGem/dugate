packages:
  - orchestrator/packages/*
  - orchestrator/services/*
  - orchestrator/apps/*
  - tests/*

# Business workers are independent nested pnpm workspaces. Their vendored
# @du/* packages intentionally stay outside the platform workspace graph.

allowBuilds:
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false

overrides:
  '@types/mammoth': npm:empty-npm-package@1.0.0
  pdf-lib@^1.17.9: ^1.17.1
  xlsx: file:orchestrator/vendor/xlsx-0.20.3.tgz

patchedDependencies:
  braces@3.0.3: orchestrator/patches/braces@3.0.3.patch
