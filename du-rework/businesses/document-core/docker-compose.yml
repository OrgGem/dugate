# document-core — per-service compose (doc lap)
name: du-document-core

services:
  document-core:
    build:
      context: ../..
      dockerfile: businesses/document-core/Dockerfile
    image: du-document-core:latest
    environment:
      RUNTIME_URL: ${RUNTIME_URL:-http://orchestrator:3000/api/runtime/v1}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?RUNTIME_TOKEN is required}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      CONNECTOR_URL: ${CONNECTOR_URL:-}
      CONNECTOR_SERVICE_TOKEN: ${CONNECTOR_SERVICE_TOKEN:-}
      CONCURRENCY: ${DOCUMENT_CORE_CONCURRENCY:-2}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-15000}
      IMAGE_DIGEST: ${DOCUMENT_CORE_IMAGE_DIGEST:-}
    depends_on:
      orchestrator:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - du-worker-net
    restart: unless-stopped

  # Deps khi chay rieng — merge voi compose tong
  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    image: du-orchestrator:latest
    environment:
      PORT: ${ORCHESTRATOR_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://du:du_production_change_me@postgres:5432/du_orchestrator}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?RUNTIME_TOKEN is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
    ports:
      - "${ORCHESTRATOR_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - du-platform-net
      - du-worker-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-du}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-du_production_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-du_orchestrator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - du-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-du} -d ${POSTGRES_DB:-du_orchestrator}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    networks:
      - du-platform-net
      - du-worker-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  du-platform-net:
    name: du-platform-net
  du-worker-net:
    name: du-worker-net

volumes:
  pgdata:
  valkeydata:
